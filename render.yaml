services:
  - type: web
    name: worldmaplive
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/init_db.py
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: worldmaplive-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: worldmaplive-db
    databaseName: worldmaplive
    user: worldmaplive
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    ipAllowList: []
